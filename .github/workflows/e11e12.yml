name: E11-E12 integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    name: e11e12-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure CI identity and environment
        run: |
          git config --local user.name 999999999
          git config --local user.email ci@example.invalid
          docker build --build-arg BASE_IMAGE=python:3.13-slim@sha256:f82c96458eedc847b233e582eb31336f4954b39cae020b6dcf5b3ed0e5cbcd74 -f labs/e11e12/environment/services/buildchecker/Dockerfile -t course-e11e12:999999999 labs/e11e12/environment
      - name: Contracts and integration
        run: |
          python3 run_e11e12.py test
          python3 run_e11e12.py prepare
          for mode in e11-a e11-b e12; do
            python3 run_e11e12.py run --request "data/integration-sample/$mode.json" --out "work/ci-$mode"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e11e12-evidence-${{ github.run_id }}
          path: work/
          retention-days: 14
